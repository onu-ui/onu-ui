name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🥴
        uses: actions/checkout@v7

      - name: Install pnpm 🚀
        uses: pnpm/action-setup@v6

      - name: Set node LTS ✨
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Dependencies 🧱
        run: pnpm i

      - name: Build 📦️
        run: pnpm build

      - name: Typecheck 👻
        run: pnpm typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [ lts/* ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      fail-fast: false

    steps:
      - name: Checkout 🥴
        uses: actions/checkout@v7

      - name: Install pnpm 🚀
        uses: pnpm/action-setup@v6

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install Dependencies 📦️
        run: pnpm i

      - name: Build 📦️
        run: pnpm build

      - name: Test 🍔
        run: pnpm test
