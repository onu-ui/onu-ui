allowBuilds:
  esbuild: true
  simple-git-hooks: true

shellEmulator: true
packages:
  - playground
  - examples/*
  - packages/*
  - '!**/test/**'
  - docs

catalogs:
  # Build tools
  build:
    tsdown: ^0.22.14
    typescript: ^5.9.3
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    vite: ^8.2.1
    vite-plugin-dts: ^5.0.3
    vite-plugin-inspect: ^12.0.2

  # Development tools
  dev:
    '@antfu/eslint-config': ^9.3.0
    '@types/fs-extra': ^11.0.4
    '@types/node': ^26.2.0
    bumpp: ^12.2.1
    compare-versions: ^6.1.1
    cross-env: ^10.1.0
    eslint: ^10.8.1
    esno: ^4.8.0
    execa: ^10.0.1
    fs-extra: ^11.4.0
    lint-staged: ^17.3.0
    ofetch: ^1.5.1
    prettier: ^3.9.6
    rimraf: ^6.1.3
    simple-git-hooks: ^2.13.1
    taze: ^21.1.0

  # Documentation
  docs:
    '@shikijs/vitepress-twoslash': ^4.4.3
    vitepress: ^1.6.4

  # Icon libraries
  icons:
    '@iconify-json/carbon': ^1.2.25
    '@iconify-json/fluent-emoji': ^1.2.7
    '@iconify-json/lets-icons': ^1.2.2
    '@iconify-json/line-md': ^1.2.16
    '@iconify-json/logos': ^1.2.13
    '@iconify-json/ri': ^1.2.10

  # Testing
  testing:
    '@vitest/coverage-v8': ^4.1.10
    '@vitest/ui': ^4.1.10
    jsdom: ^30.0.1
    vitest: ^4.1.10

  # UnoCSS ecosystem
  unocss:
    '@unocss/cli': ^66.7.5
    '@unocss/core': ^66.7.5
    '@unocss/preset-icons': ^66.7.5
    '@unocss/preset-mini': ^66.7.5
    '@unocss/preset-uno': ^66.7.5
    '@unocss/preset-web-fonts': ^66.7.5
    '@unocss/preset-wind4': ^66.7.5
    '@unocss/reset': ^66.7.5
    magic-color: ^2.2.5
    unocss: ^66.7.5
    unocss-transformer-alias: ^0.1.0

  # Vue ecosystem
  vue:
    '@vitejs/plugin-vue': ^6.0.8
    '@vue/repl': ^4.7.2
    '@vue/test-utils': ^2.4.11
    '@vueuse/core': ^14.4.0
    floating-vue: ^5.2.2
    vue: ^3.5.41
    vue-flow-layout: ^0.2.0
    vue-tsc: ^3.3.10
